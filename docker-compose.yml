services:
  web:
    build:
      context: .
      target: runtime
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    env_file:
      - .env

    # Developpement avec rechargement a chaud : docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install -g pnpm@12 && pnpm install && pnpm dev --host 0.0.0.0"
    environment:
      NUXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: development
    env_file:
      - .env
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/pnpm/store

volumes:
  node_modules:
  pnpm-store:
    external: true
    name: pnpm-store-shared
